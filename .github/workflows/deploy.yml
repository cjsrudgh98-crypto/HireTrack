# main 에 머지되면: CI 재검증 → Docker 이미지(GHCR) 빌드·푸시 → 서버에 SSH → 새 이미지로 교체 → 헬스체크 실패 시 이전 이미지로 롤백
#
# 필요한 설정
#  - Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY(개인키), DEPLOY_KNOWN_HOSTS(ssh-keyscan 결과)
#  - Environment "production" (Settings → Environments, 필요하면 승인자 지정)
#  - 서버: /opt/hiretrack 에 docker-compose.prod.yml · .env · scripts/ 배치, ghcr.io 로그인(read:packages 토큰) 1회
#  - Variables: DEPLOY_ENABLED=true — 서버를 준비하기 전에는 main push 로 배포가 돌지 않는다(수동 실행은 언제나 가능)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false # 배포 도중에 끊지 않는다

jobs:
  ci:
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        name: Image names (GHCR 은 소문자만 허용)
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/hiretrack-app:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/hiretrack-app:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Push web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/hiretrack-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/hiretrack-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (헬스체크 실패 시 서버 스크립트가 롤백하고 이 job 을 실패시킨다)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "cd /opt/hiretrack && ./scripts/deploy.sh '$TAG'"
